<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>מנקה טקסט</title>
<style>
  :root{
    --ink:#1c2321;
    --paper:#f6f4ee;
    --line:#d8d3c4;
    --accent:#2f6f5e;
    --accent-dark:#234f42;
    --muted:#6b6459;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Segoe UI", Arial, sans-serif;
    min-height:100vh;
    display:flex;
    justify-content:center;
    padding:40px 20px;
  }
  .wrap{
    width:100%;
    max-width:760px;
  }
  h1{
    font-size:26px;
    margin:0 0 6px;
    letter-spacing:-0.3px;
  }
  .sub{
    color:var(--muted);
    font-size:14px;
    margin:0 0 26px;
    line-height:1.6;
  }
  .row{
    display:flex;
    gap:16px;
    align-items:flex-start;
  }
  @media (max-width:640px){
    .row{flex-direction:column;}
  }
  .col{
    flex:1;
    min-width:0;
  }
  label{
    display:block;
    font-size:12px;
    color:var(--muted);
    margin-bottom:6px;
    font-weight:600;
  }
  textarea{
    width:100%;
    height:280px;
    resize:vertical;
    border:1px solid var(--line);
    border-radius:8px;
    padding:14px;
    font-size:14px;
    line-height:1.7;
    background:#fff;
    color:var(--ink);
    font-family:inherit;
  }
  textarea:focus{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }
  #output{
    background:#fbfaf6;
  }
  .arrow{
    display:flex;
    align-items:center;
    justify-content:center;
    padding-top:110px;
    color:var(--accent);
    font-size:20px;
  }
  @media (max-width:640px){
    .arrow{padding-top:0; transform:rotate(90deg); padding:4px 0;}
  }
  .controls{
    display:flex;
    align-items:center;
    gap:12px;
    margin-top:18px;
    flex-wrap:wrap;
  }
  button{
    border:none;
    border-radius:8px;
    padding:10px 20px;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    font-family:inherit;
  }
  .primary{
    background:var(--accent);
    color:#fff;
  }
  .primary:hover{background:var(--accent-dark);}
  .secondary{
    background:transparent;
    color:var(--accent);
    border:1px solid var(--accent);
  }
  .secondary:hover{background:#eef4f1;}
  .toast{
    font-size:13px;
    color:var(--accent-dark);
    opacity:0;
    transition:opacity .2s;
  }
  .toast.show{opacity:1;}
  .stat{
    font-size:12px;
    color:var(--muted);
    margin-top:6px;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>מנקה טקסט</h1>
  <p class="sub">מדביקים טקסט, לוחצים "נקה", וכל שורה ריקה בין השורות נעלמת - התוצאה צמודה לגמרי.</p>

  <div class="row">
    <div class="col">
      <label for="input">טקסט מקורי</label>
      <textarea id="input" placeholder="הדביקו כאן..."></textarea>
      <div class="stat" id="inStat">0 שורות</div>
    </div>
    <div class="arrow">→</div>
    <div class="col">
      <label for="output">טקסט נקי</label>
      <textarea id="output" placeholder="התוצאה תופיע כאן..." readonly></textarea>
      <div class="stat" id="outStat">0 שורות</div>
    </div>
  </div>

  <div class="controls">
    <button class="primary" onclick="clean()">נקה טקסט</button>
    <button class="secondary" onclick="copyOut()">העתק תוצאה</button>
    <button class="secondary" onclick="clearAll()">נקה הכל</button>
    <span class="toast" id="toast">הועתק ללוח ✓</span>
  </div>
</div>

<script>
function countLines(t){
  if(!t) return 0;
  return t.split("\n").length;
}

function clean(){
  const raw = document.getElementById('input').value;
  const lines = raw.split("\n").map(l => l.trim());
  const result = lines.filter(line => line.length > 0);

  const out = result.join("\n");
  document.getElementById('output').value = out;
  document.getElementById('inStat').textContent = countLines(raw) + " שורות";
  document.getElementById('outStat').textContent = countLines(out) + " שורות";
}

function copyOut(){
  const out = document.getElementById('output');
  if(!out.value) return;
  navigator.clipboard.writeText(out.value).then(()=>{
    const t = document.getElementById('toast');
    t.classList.add('show');
    setTimeout(()=>t.classList.remove('show'), 1500);
  });
}

function clearAll(){
  document.getElementById('input').value = "";
  document.getElementById('output').value = "";
  document.getElementById('inStat').textContent = "0 שורות";
  document.getElementById('outStat').textContent = "0 שורות";
}

document.getElementById('input').addEventListener('input', ()=>{
  document.getElementById('inStat').textContent = countLines(document.getElementById('input').value) + " שורות";
});
</script>
</body>
</html>
